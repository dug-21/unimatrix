# Unimatrix — single-service deployment.
# Start: docker compose up -d
# Logs:  docker compose logs -f
# Stop:  docker compose down
#
# Client attach:    docs/client-setup.md
# Cert rotation:    docs/cert-rotation.md  (rotate cert -> client-bundle -> re-init clients)

services:
  unimatrix:
    # Operator-facing default stays ghcr :latest; the ${UNIMATRIX_IMAGE:-...} interpolation
    # is back-compat (unset => :latest). The release smoke's compose-boot gate (#915)
    # OVERRIDES it with UNIMATRIX_IMAGE=<version-under-test> + `--pull never` so the gate
    # proves the candidate build, never the already-released :latest.
    image: ${UNIMATRIX_IMAGE:-ghcr.io/dug-21/unimatrix:latest}
    # To build locally instead of pulling:
    #   build: .
    restart: unless-stopped
    # Container serving posture (vnc-034 / ADR-007, C3). Both knobs are env vars
    # in this file — one mechanism, one place the operator edits. Secrets are NOT
    # here: the bearer token and TLS cert/key stay as 0600 files on the /data
    # volume (NFR-05/NFR-06); env carries only the non-sensitive boolean + URL.
    environment:
      # Flip the HTTP(S) serving posture on (ADR-007). The global binary default
      # is http.enabled=false (clean for the local UDS install); this
      # container-scoped env var overrides it without an image rebuild — critical
      # for the distroless no-shell image. Remove this line for a UDS-only
      # container.
      UNIMATRIX_HTTP_ENABLED: "true"
      # Public URL the clients dial (C3). Feeds the client-bundle base-url, the
      # allowed_hosts default, and the TLS cert SAN via derive_public_url().
      # MUST be set to your reachable host:8443 BEFORE running `client-bundle`,
      # or the bundle base-url is the loud <EDIT-ME> placeholder (FR-A5b).
      # Use the service name for sibling-container reachability (AC-W1-S1),
      # or the externally reachable host for off-host clients.
      UNIMATRIX_PUBLIC_URL: "https://cloud.example:8443"
      # For external config (Kubernetes ConfigMap, secrets manager):
      #   UNIMATRIX_CONFIG: /path/to/config.toml
    ports:
      # TLS port ONLY — pinned-TLS HTTPS (ADR-007, FR-A8, AC-W1-S2, R-12).
      # There is NO plaintext port: OSS posture has no plaintext-to-client mode.
      - "8443:8443"
    volumes:
      - unimatrix-data:/data
      # /shared is READ-WRITE by default (ADR-003 nan-015 #4652). The image bakes
      # NO model (pattern #4658), so first boot MUST be able to download the ONNX
      # models into /shared — a :ro default makes that write fail with EROFS and
      # embed lands EmbedFailed (#767). `:ro` is OPTIONAL hardening to apply ONLY
      # AFTER the volume has been populated; see the unimatrix-shared note below.
      - unimatrix-shared:/shared
      # unimatrix-data: databases, vector indexes, config, logs (integrity-critical, back up).
      # unimatrix-shared: ONNX models (re-downloadable, backup optional).
      # Config: per-project config.toml lives inside the data volume.
      # Written automatically on first run. Edit via:
      #   docker run --rm -v unimatrix-data:/data busybox vi /data/.unimatrix/<hash>/config.toml
      #
      # Bind-mount note (vnc-034 / FR-A9, AC-W1-S8): if you replace the named
      # `unimatrix-data` volume with a host bind-mount, the host directory MUST be
      # writable by UID 65532 (the nonroot runtime user) or first-boot cert/token
      # provisioning fails loud-and-actionable and the container exits non-zero:
      #   mkdir -p ./data && sudo chown 65532:65532 ./data
      #   then:  - ./data:/data

volumes:
  unimatrix-data:
    # Integrity-critical data: databases, vector indexes, config, logs.
    # Persists across container restarts. Back up frequently.
    # Backup:
    #   docker run --rm -v unimatrix-data:/data -v $(pwd):/backup \
    #     busybox tar czf /backup/unimatrix-backup.tar.gz /data
  unimatrix-shared:
    # Re-downloadable assets: ONNX models (~166 MB).
    # Backup optional -- models re-download from HuggingFace if lost.
    #
    # Security notes:
    #   - Default is :rw (above) — required for the first-boot model download
    #     (no model is baked into the image, pattern #4658).
    #   - Optional hardening: AFTER first boot has populated the volume, you may
    #     append `:ro` to the mount (`- unimatrix-shared:/shared:ro`) to prevent
    #     model tampering. Do NOT start with :ro on a virgin volume — first boot
    #     has nowhere to write the download and embed fails (#767).
    #   - Air-gap: pre-populate the volume FIRST (e.g.
    #       docker run --rm -v unimatrix-shared:/shared ghcr.io/dug-21/unimatrix \
    #         --project-dir /data model-download
    #     or pre-seed it from a populated host), THEN mount :ro.
    #   - Bind-mount caveat: a host bind-mount for /shared must be writable by
    #     UID 65532 (the nonroot runtime user) or first-boot download fails loud.
    #   - Set nli_model_sha256 in config.toml to pin NLI model integrity.
    #   - Embedding model hash enforcement tracked as #651.

# ──────────────────────────────────────────────────────────────────────
# Debug override (shell access for troubleshooting)
# ──────────────────────────────────────────────────────────────────────
# The runtime image is distroless (no shell). For debugging, create
# a docker-compose.override.yml alongside this file:
#
#   services:
#     unimatrix:
#       image: debian:12-slim
#       entrypoint: ["/bin/bash", "-c", "sleep infinity"]
#       volumes:
#         - unimatrix-data:/data
#
# Then: docker compose up -d && docker exec -it unimatrix-unimatrix-1 /bin/bash
# This gives shell access to the /data volume for inspection.
# Remove the override file to return to normal operation.
