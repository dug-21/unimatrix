name: Release
"on":
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: "1.20.1"

jobs:
  build-linux-x64:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x64-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x64-release-

      - name: Verify patched dependencies
        run: |
          if [ ! -d "patches/anndists" ]; then
            echo "ERROR: patches/anndists directory missing"
            exit 1
          fi

      - name: Install ONNX Runtime
        run: |
          curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | tar xz
          sudo cp onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so* /usr/local/lib/
          sudo ldconfig

      - name: Build
        run: cargo build --release
        env:
          ORT_LIB_LOCATION: /usr/local/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN"

      - name: Strip binary
        run: strip target/release/unimatrix

      - name: Verify rpath
        run: |
          if ! objdump -x target/release/unimatrix | grep -q 'RUNPATH.*ORIGIN'; then
            echo "ERROR: Binary missing RUNPATH \$ORIGIN — rpath not baked correctly"
            exit 1
          fi

      - name: Bundle binary and shared libraries
        run: |
          mkdir -p artifact/bin
          cp target/release/unimatrix artifact/bin/
          cp -L /usr/local/lib/libonnxruntime.so.${ORT_VERSION} artifact/bin/
          cp -L /usr/local/lib/libonnxruntime.so.${ORT_VERSION} artifact/bin/libonnxruntime.so.1

      - name: Check shared libraries
        run: |
          ldd artifact/bin/unimatrix
          if ldd artifact/bin/unimatrix 2>&1 | grep -q "not found"; then
            echo "ERROR: Binary has missing shared library dependencies"
            exit 1
          fi

      - name: Smoke test
        run: |
          OUTPUT=$(artifact/bin/unimatrix version)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "^unimatrix "; then
            echo "ERROR: Unexpected version output: $OUTPUT"
            exit 1
          fi

      - name: Download embedding model
        run: LD_LIBRARY_PATH=/usr/local/lib target/release/unimatrix model-download

      - name: Test
        run: |
          cargo test --release || cargo test --release
        env:
          ORT_LIB_LOCATION: /usr/local/lib
          ORT_PREFER_DYNAMIC_LINK: "1"

      - name: Binary size
        run: |
          ls -lh artifact/bin/unimatrix
          ls -lh artifact/bin/libonnxruntime.so.*

      - uses: actions/upload-artifact@v4
        with:
          name: unimatrix-linux-x64
          path: artifact/bin/
          retention-days: 1

  build-linux-arm64:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-arm64-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-arm64-release-

      - name: Verify patched dependencies
        run: |
          if [ ! -d "patches/anndists" ]; then
            echo "ERROR: patches/anndists directory missing"
            exit 1
          fi

      - name: Install ONNX Runtime
        run: |
          curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-aarch64-${ORT_VERSION}.tgz" | tar xz
          sudo cp onnxruntime-linux-aarch64-${ORT_VERSION}/lib/libonnxruntime.so* /usr/local/lib/
          sudo ldconfig

      - name: Build
        run: cargo build --release
        env:
          ORT_LIB_LOCATION: /usr/local/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN"

      - name: Strip binary
        run: strip target/release/unimatrix

      - name: Verify rpath
        run: |
          if ! objdump -x target/release/unimatrix | grep -q 'RUNPATH.*ORIGIN'; then
            echo "ERROR: Binary missing RUNPATH \$ORIGIN — rpath not baked correctly"
            exit 1
          fi

      - name: Bundle binary and shared libraries
        run: |
          mkdir -p artifact/bin
          cp target/release/unimatrix artifact/bin/
          cp -L /usr/local/lib/libonnxruntime.so.${ORT_VERSION} artifact/bin/
          cp -L /usr/local/lib/libonnxruntime.so.${ORT_VERSION} artifact/bin/libonnxruntime.so.1

      - name: Check shared libraries
        run: |
          ldd artifact/bin/unimatrix
          if ldd artifact/bin/unimatrix 2>&1 | grep -q "not found"; then
            echo "ERROR: Binary has missing shared library dependencies"
            exit 1
          fi

      - name: Smoke test
        run: |
          OUTPUT=$(artifact/bin/unimatrix version)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "^unimatrix "; then
            echo "ERROR: Unexpected version output: $OUTPUT"
            exit 1
          fi

      - name: Download embedding model
        run: LD_LIBRARY_PATH=/usr/local/lib target/release/unimatrix model-download

      - name: Test
        run: |
          cargo test --release || cargo test --release
        env:
          ORT_LIB_LOCATION: /usr/local/lib
          ORT_PREFER_DYNAMIC_LINK: "1"

      - name: Binary size
        run: |
          ls -lh artifact/bin/unimatrix
          ls -lh artifact/bin/libonnxruntime.so.*

      - uses: actions/upload-artifact@v4
        with:
          name: unimatrix-linux-arm64
          path: artifact/bin/
          retention-days: 1

  package-npm:
    needs: [build-linux-x64, build-linux-arm64]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          node-auth-token: ''

      - uses: actions/download-artifact@v4
        with:
          name: unimatrix-linux-arm64
          path: packages/unimatrix-linux-arm64/bin/

      - uses: actions/download-artifact@v4
        with:
          name: unimatrix-linux-x64
          path: packages/unimatrix-linux-x64/bin/

      - name: Set permissions
        run: |
          chmod +x packages/unimatrix-linux-arm64/bin/unimatrix
          chmod +x packages/unimatrix-linux-x64/bin/unimatrix

      - name: Bundle skills
        run: |
          mkdir -p packages/unimatrix/skills
          for dir in .claude/skills/*/; do
            if [ -f "${dir}SKILL.md" ]; then
              cp -r "$dir" packages/unimatrix/skills/
            fi
          done

      - name: Validate versions
        run: |
          CARGO_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION=${GITHUB_REF_NAME#v}

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Tag version: $TAG_VERSION"

          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          for pkg in packages/*/package.json; do
            NPM_VERSION=$(node -e "console.log(require('./$pkg').version)")
            if [ "$NPM_VERSION" != "$CARGO_VERSION" ]; then
              echo "ERROR: $pkg version ($NPM_VERSION) does not match Cargo.toml ($CARGO_VERSION)"
              exit 1
            fi
          done

      # INVARIANT: every publish/push step in this workflow MUST be safe to
      # re-run on an already-completed version. Re-running the same tag is the
      # standard release-recovery path (see #812, #818) — a non-idempotent step
      # breaks recovery and cascades (e.g. skips create-release via `needs:`).
      # npm versions are immutable, so each publish below is guarded: gate on
      # NON-EMPTY `npm view` stdout, never exit code — `npm view pkg@ver version`
      # exits 0 with empty stdout when the version is missing but the package
      # name exists, and only exits non-zero (E404) when the name was never
      # published; gating on $? would silently skip a new package's first publish.
      - name: Publish @dug-21/unimatrix-linux-arm64
        working-directory: packages/unimatrix-linux-arm64
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "${PKG}@${VER}" version 2>/dev/null)" ]; then
            echo "skip: ${PKG}@${VER} already published"
          else
            echo "publish: ${PKG}@${VER}"
            npm publish --access public --provenance
          fi

      - name: Publish @dug-21/unimatrix-linux-x64
        working-directory: packages/unimatrix-linux-x64
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "${PKG}@${VER}" version 2>/dev/null)" ]; then
            echo "skip: ${PKG}@${VER} already published"
          else
            echo "publish: ${PKG}@${VER}"
            npm publish --access public --provenance
          fi

      - name: Publish @dug-21/unimatrix
        working-directory: packages/unimatrix
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "${PKG}@${VER}" version 2>/dev/null)" ]; then
            echo "skip: ${PKG}@${VER} already published"
          else
            echo "publish: ${PKG}@${VER}"
            npm publish --access public --provenance
          fi

  create-release:
    needs: package-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi

          BODY=""

          FEATURES=$(git log $RANGE --format="%s" | grep "^feat:" | sed "s/^feat: //" || true)
          if [ -n "$FEATURES" ]; then
            BODY="${BODY}### Features\n"
            while IFS= read -r line; do
              BODY="${BODY}- ${line}\n"
            done <<< "$FEATURES"
            BODY="${BODY}\n"
          fi

          FIXES=$(git log $RANGE --format="%s" | grep "^fix:" | sed "s/^fix: //" || true)
          if [ -n "$FIXES" ]; then
            BODY="${BODY}### Fixes\n"
            while IFS= read -r line; do
              BODY="${BODY}- ${line}\n"
            done <<< "$FIXES"
            BODY="${BODY}\n"
          fi

          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # INVARIANT: re-run-safe. softprops/action-gh-release@v2 updates an
      # existing release rather than erroring, so re-running the same tag is OK.
      # Do not switch to `gh release create` (errors if the release exists)
      # without adding a view-or-create / --clobber guard.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

  # Container build jobs — independent branch, no needs link to binary/npm jobs (ADR-004).
  build-container-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unimatrix
          tags: |
            type=semver,pattern=v{{version}}-amd64
            type=raw,value=latest-amd64

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64

  build-container-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unimatrix
          tags: |
            type=semver,pattern=v{{version}}-arm64
            type=raw,value=latest-arm64

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-arm64
          cache-to: type=gha,mode=max,scope=container-arm64

  # Verify-by-name / skip-is-failure smoke gates (nan-019). Each pulls the exact pushed
  # per-arch GHCR bytes and runs the existing smoke as a release gate that blocks the
  # multi-arch manifest. No continue-on-error, no retry (ADR-003 / C-04). The gate spine
  # is sourced from product/test/infra-001/scripts/release-gate-lib.sh — the SAME bytes
  # the pre-merge gate-logic test sources (single source of truth, R-01).
  smoke-amd64:
    needs: [build-container-x64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Provision pinned Node for the documented init --bundle leg (nan-020)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke the pushed amd64 image (verify-by-name gate)
        run: |
          set -euo pipefail
          source product/test/infra-001/scripts/release-gate-lib.sh
          IMAGE="$(resolve_image "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_EVENT_NAME}" "${GITHUB_REF_NAME}" amd64)"
          echo "smoke target IMAGE=${IMAGE}"
          run_smoke_gate "${IMAGE}" bash product/test/infra-001/scripts/docker-http-posture-smoke.sh

  smoke-arm64:
    needs: [build-container-arm64]
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Provision pinned Node for the documented init --bundle leg (nan-020)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke the pushed arm64 image (verify-by-name gate)
        run: |
          set -euo pipefail
          source product/test/infra-001/scripts/release-gate-lib.sh
          IMAGE="$(resolve_image "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_EVENT_NAME}" "${GITHUB_REF_NAME}" arm64)"
          echo "smoke target IMAGE=${IMAGE}"
          run_smoke_gate "${IMAGE}" bash product/test/infra-001/scripts/docker-http-posture-smoke.sh

  # First-boot EMBEDDING-READINESS gates (#767). Separate from the HTTP-posture
  # smoke because this gate downloads the ONNX model from HuggingFace and waits
  # PAST the embed retry/backoff window (~70s+) — a 70s+ first-boot wait must NOT
  # run per-PR; it belongs only on the release gate. It mounts BOTH volumes with
  # /shared in the compose-declared mode and asserts a REAL context_store ->
  # context_search embedding round trip (not /health liveness — that PASSES on the
  # broken state). Shares the SAME run_smoke_gate spine (single source of truth).
  embed-amd64:
    needs: [build-container-x64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Embed-readiness gate, pushed amd64 image (#767)
        run: |
          set -euo pipefail
          source product/test/infra-001/scripts/release-gate-lib.sh
          IMAGE="$(resolve_image "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_EVENT_NAME}" "${GITHUB_REF_NAME}" amd64)"
          echo "embed-readiness target IMAGE=${IMAGE}"
          run_smoke_gate "${IMAGE}" bash product/test/infra-001/scripts/docker-embed-readiness-smoke.sh

  embed-arm64:
    needs: [build-container-arm64]
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Embed-readiness gate, pushed arm64 image (#767)
        run: |
          set -euo pipefail
          source product/test/infra-001/scripts/release-gate-lib.sh
          IMAGE="$(resolve_image "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_EVENT_NAME}" "${GITHUB_REF_NAME}" arm64)"
          echo "embed-readiness target IMAGE=${IMAGE}"
          run_smoke_gate "${IMAGE}" bash product/test/infra-001/scripts/docker-embed-readiness-smoke.sh

  # nan-021 HTTPS-vs-UDS MetricVector parity gate (D-3 / ADR-005 / AC-05). A
  # STANDING gate in the release-gate Docker lane via workflow_dispatch/tag —
  # NOT the JS-only ci.yml pull_request matrix (Rust/container validation lives
  # here, per the standing rule). It runs the pytest orchestrator
  # (suites/test_https_uds_parity.py -m parity, ADR-001 pytest-as-orchestrator):
  # the UDS leg runs in-process against a live daemon, and the HTTPS leg is the
  # smoke's C1+C2 cloud_cycle_gates shelled out via UNIMATRIX_HTTPS_SMOKE ->
  # cloud-cycle-https-leg.sh, which wraps docker-http-posture-smoke.sh in the
  # SHIPPED release-gate-lib.sh:run_smoke_gate (verify-by-name exit-code
  # discriminator + anchored [*-smoke] ALL GATES PASSED marker — Docker-absent
  # exit 3 is a HARD failure, an early-exit-0 without the marker is RED; the
  # nan-019 docker pull||inspect||exit-4 acquisition is reused verbatim by the
  # smoke). pytest then ingests the token-correlated MetricVector(HTTPS) and runs
  # the C4 comparator field-for-field (modulo the closed D-5 wall-clock set).
  #
  # FIRST-GREEN BUDGET (ADR-005 / #5266/#5267): this lane has never run green —
  # the bridge/cert/SSE path is first truly exercised here, so it is expected to
  # surface failures in sequence across N tag rounds (cert -> bridge -> cycle ->
  # review -> parity). It is therefore wired as an INDEPENDENT gate (its result
  # is visible on every tag + dispatch) and is intentionally NOT in
  # create-container-manifest's `needs:` until first-green is achieved — a
  # never-green lane must not block every release while the round-trip is
  # budgeted. Promote it into the manifest `needs:` once it greens (it ADVANCES
  # C0; the proven flip is held by #837). The gate spine is stub-driven pre-merge
  # by release-gate-cloud-cycle-logic-test.sh (R-12) so this is not the first
  # place the gate logic runs.
  nan-021-https-uds-parity:
    needs: [build-container-x64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Provision pinned Node for the shipped mcp-bridge.js leg
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Provision Python for the pytest orchestrator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest harness deps
        run: pip install pytest pytest-timeout pytest-json-report

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: HTTPS-vs-UDS parity gate (pytest orchestrator + verify-by-name HTTPS leg)
        working-directory: product/test/infra-001
        run: |
          set -euo pipefail
          source scripts/release-gate-lib.sh
          IMAGE="$(resolve_image "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_EVENT_NAME}" "${GITHUB_REF_NAME}" amd64)"
          echo "parity target IMAGE=${IMAGE}"
          # The HTTPS leg is the smoke wrapped in run_smoke_gate (false-green
          # discriminator); pytest's run_https_leg shells it out with the C2
          # contract env. IMAGE is exported so the wrapper's run_smoke_gate
          # passes it to the smoke's nan-019 acquisition path.
          export IMAGE
          export UNIMATRIX_HTTPS_SMOKE="$(pwd)/scripts/cloud-cycle-https-leg.sh"
          python -m pytest suites/test_https_uds_parity.py -v -m parity --timeout=900

  create-container-manifest:
    needs: [smoke-amd64, smoke-arm64, embed-amd64, embed-arm64]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          IMAGE=ghcr.io/${{ github.repository_owner }}/unimatrix

          # imagetools assembles a multi-arch index from the per-arch sources.
          # Unlike `docker manifest create`, it accepts manifest-list/attestation-index
          # sources (buildx attaches a provenance attestation, wrapping each per-arch
          # push in an OCI index) and preserves those attestations in the result.
          docker buildx imagetools create -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:latest-amd64 \
            ${IMAGE}:latest-arm64
