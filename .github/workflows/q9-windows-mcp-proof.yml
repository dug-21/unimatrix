name: Q9 Windows MCP argv proof (nan-024 D-034)

# Non-required proof job. Stub shim stands in for the real one (not yet written).
# Claude Code is approximated by Node child_process.spawn (shell:false); Codex by a
# compiled Rust std::process::Command harness. Real harness binaries are not run
# (no auth / MCP session available in CI) -- documented limitation.
on:
  workflow_dispatch:
  push:
    branches: [feature/nan-024]
    paths: ['.github/q9-proof/**', '.github/workflows/q9-windows-mcp-proof.yml']

jobs:
  q9:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Rust spawn harness
        shell: bash
        run: rustc -O .github/q9-proof/spawn.rs -o "$RUNNER_TEMP/spawn.exe"
      - name: MCP primary form (cmd /d /s /c)
        if: always()
        run: node .github/q9-proof/driver.js mcp-primary
      - name: MCP fallback form (D-047 node + shim-entry.js)
        if: always()
        run: node .github/q9-proof/driver.js mcp-fallback
      - name: Hook form (.cmd via cmd.exe /C and Git Bash)
        if: always()
        run: node .github/q9-proof/driver.js hook
