[package]
name = "unimatrix-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Unimatrix MCP knowledge server"

[[bin]]
name = "unimatrix"
path = "src/main.rs"

[lib]
name = "unimatrix_server"
path = "src/lib.rs"

[dependencies]
unimatrix-core = { path = "../unimatrix-core", features = ["async"] }
unimatrix-store = { path = "../unimatrix-store" }
# production-safe; required by eval runner for kendall_tau and ranking metrics (ADR-003, nan-007)
unimatrix-engine = { path = "../unimatrix-engine", features = ["test-support"] }
unimatrix-vector = { path = "../unimatrix-vector" }
unimatrix-embed = { path = "../unimatrix-embed" }
unimatrix-adapt = { path = "../unimatrix-adapt" }
unimatrix-observe = { path = "../unimatrix-observe" }
unimatrix-learn = { path = "../unimatrix-learn" }

http = "1"
nix = { version = "0.31", features = ["user", "process"] }
# petgraph: needed for NodeIndex in BFS traversal (neighbors depth>1, ADR-005, vnc-018)
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
fs2 = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
rmcp = { version = "=1.7.0", features = ["server", "client", "transport-io", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
# rmcp-macros: lockstep pin with rmcp. rmcp 1.7.0 depends on rmcp-macros = "^1.7.0", and
# `cargo install` ignores Cargo.lock, so a fresh resolve would pair rmcp 1.7.0 with a newer
# rmcp-macros whose #[tool] codegen references symbols absent in the pinned rmcp lib (#902).
# Bump BOTH =pins together on any rmcp upgrade. Unreferenced in source — macros are re-exported through rmcp.
rmcp-macros = "=1.7.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
schemars = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
toml = "0.8"
rayon = "1"
rand = "0.9"
num_cpus = "1"
thiserror = "2"
tokio-rustls = "0.26"
rustls-pemfile = "2"
subtle = "2"
# async-trait: crt-056 (ADR-004) — dyn-compatible async `BackgroundJob::run`
# so the registry can be a `Vec<Box<dyn BackgroundJob>>`.
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
hex = "0.4"
# base64: C1 bundle wire form (vnc-034, ADR-001) — base64url no-pad encode/decode.
# Same workspace version already used by unimatrix-store; no new lockfile entry.
base64 = "0.22"
# tokenizers: faithful subword tier for the eval cost metric (nan-018 ADR-003).
# Mirrors the version/features already in the unimatrix-embed dependency tree.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
bytes = "1"
http-body = "1"
http-body-util = "0.1"
# rcgen: first-boot self-signed cert/key generation (vnc-034 CertProvisioner, SR-01).
# Promoted from a dev-dependency when the test-only generate_self_signed helper
# became the production load_or_generate_cert provisioner.
rcgen = "0.13"

[features]
default = ["mcp-briefing"]
mcp-briefing = []
test-support = ["unimatrix-store/test-support", "unimatrix-engine/test-support"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
unimatrix-server = { path = ".", features = ["test-support"] }
tracing-test = "0.2"

[lints]
workspace = true
