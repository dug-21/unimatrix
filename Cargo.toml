[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.8.5"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

# Baseline lint guard (GH #798): keep the workspace clippy-clean. Members inherit via
# `[lints] workspace = true`. Not applied to patches/anndists (external vendored patch).
[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Patch anndists 0.1.4: fix cfg_if + #[cfg] block compilation with edition 2024.
# Upstream declares edition = "2024" but has code incompatible with it.
# Replaces cfg_if! blocks with explicit #[cfg] attributes on fn eval impls
# for DistL1, DistL2, and DistDot.
[patch.crates-io]
anndists = { path = "patches/anndists" }
