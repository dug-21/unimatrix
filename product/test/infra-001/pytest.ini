[pytest]
testpaths = suites
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Critical-path tests for quick validation (~15 tests, <60s)
    slow: Tests that take more than 10 seconds
    volume: Scale and stress tests
    security: Security validation tests
    availability: Time-extended reliability tests (tick liveness, sustained operation, mutex pressure). Pre-release gate only (~15-20 min).
    integration: Tests that require a live daemon (D5/D6 eval harness).
    parity: HTTPS-vs-UDS MetricVector parity (nan-021 C3 orchestrator); the live cross-leg run shells out to the Docker smoke (Stage 3c / release-gate lane).

# Default timeout per test (seconds)
timeout = 60

# Verbose output by default
addopts = -v

# Log settings
log_cli = false
log_cli_level = WARNING
log_file_level = DEBUG
